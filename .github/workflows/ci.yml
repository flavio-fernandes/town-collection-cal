name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test the installed production package
        run: docker build --pull --target test -t town-collection-cal:test .
      - name: Build prod image
        run: docker build -t town-collection-cal:ci .
      - name: Verify runtime packaging and address model
        run: |
          docker run --rm --network none --read-only \
            -v "$PWD/scripts/check_runtime_image.py:/check_runtime_image.py:ro" \
            town-collection-cal:ci python /check_runtime_image.py
      - name: Reject fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: town-collection-cal:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Build DB for smoke test
        run: |
          mkdir -p data/cache data/generated
          docker run --rm \
            -e TOWN_ID=westford_ma \
            -e TOWN_CONFIG_PATH=/app/towns/westford_ma/town.yaml \
            -e OUT_PATH=/app/data/generated/westford_ma.json \
            -e CACHE_DIR=/app/data/cache \
            -v "$PWD/towns:/app/towns" \
            -v "$PWD/data:/app/data" \
            --user "$(id -u):$(id -g)" \
            town-collection-cal:ci \
            python -m town_collection_cal.updater build-db \
              --town /app/towns/westford_ma/town.yaml \
              --out /app/data/generated/westford_ma.json \
              --cache-dir /app/data/cache
      - name: Test live routes with the installed package
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$PWD/data/cache:/app/data/cache:ro" \
            town-collection-cal:test python -m pytest -q -p no:cacheprovider
      - name: Run with hardened flags
        run: |
          docker run -d --name town-collection-cal-ci \
            -p 8080:5000 \
            -e TOWN_ID=westford_ma \
            -e TOWN_CONFIG_PATH=/app/towns/westford_ma/town.yaml \
            -e DB_PATH=/app/data/generated/westford_ma.json \
            -v "$PWD/towns:/app/towns:ro" \
            -v "$PWD/data:/app/data" \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/tmp \
            --cap-drop=ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 200 \
            --memory 512m \
            --cpus 1 \
            --log-opt max-size=10m \
            --log-opt max-file=5 \
            town-collection-cal:ci

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS "http://127.0.0.1:8080/town.ics?weekday=Thursday&color=BLUE" -o /tmp/town.ics
          docker rm -f town-collection-cal-ci
